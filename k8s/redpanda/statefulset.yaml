apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: live-stream
  labels:
    app: redpanda
spec:
  serviceName: redpanda-service
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      securityContext:
        fsGroup: 101
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 101:101 /var/lib/redpanda/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:latest
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://redpanda-service:29092,OUTSIDE://redpanda-service:9092
          ports:
            - containerPort: 9092
              name: kafka-outside
            - containerPort: 29092
              name: kafka-internal
            - containerPort: 8081
              name: schema-registry
            - containerPort: 8082
              name: pandaproxy
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
      volumes:
        - name: redpanda-data
          persistentVolumeClaim:
            claimName: redpanda-pvc
