apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: live-stream
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 585768182430.dkr.ecr.us-east-1.amazonaws.com/streamx-auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: http
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 15
            periodSeconds: 10
